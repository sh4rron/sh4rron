<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030d1c"/>
      <stop offset="1" stop-color="#0a192f"/>
    </linearGradient>
    <radialGradient id="auroraA">
      <stop offset="0" stop-color="#64ffda" stop-opacity=".22"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB">
      <stop offset="0" stop-color="#7f5af0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ccd6f6"/>
      <stop offset=".45" stop-color="#ccd6f6"/>
      <stop offset=".5" stop-color="#64ffda"/>
      <stop offset=".55" stop-color="#ccd6f6"/>
      <stop offset="1" stop-color="#ccd6f6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffda" stop-opacity="0"/>
      <stop offset=".5" stop-color="#64ffda"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64ffda" fill-opacity=".09"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .in{opacity:0;animation:in 1s cubic-bezier(.2,.7,.2,1) forwards}
    .a1{animation-delay:.2s}.a2{animation-delay:.6s}.a3{animation-delay:1.1s}
    .driftA{animation:drift 16s ease-in-out infinite}
    .driftB{animation:drift 20s ease-in-out infinite reverse}
    .role{opacity:0;animation:role 12s ease-in-out infinite}
    .r2{animation-delay:4s}.r3{animation-delay:8s}
    .caret{animation:blink 1.05s steps(1) infinite}
    .p{animation:rise linear infinite}
    .sweep{transform-origin:600px 262px;animation:sweep 3.2s ease-in-out infinite alternate}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-30px)}}
    @keyframes role{0%{opacity:0;transform:translateY(12px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-12px)}}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-360px);opacity:0}}
    @keyframes sweep{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle class="driftA" cx="880" cy="40" r="320" fill="url(#auroraA)"/>
    <circle class="driftB" cx="260" cy="330" r="300" fill="url(#auroraB)"/>

    <!-- floating particles -->
    <g fill="#64ffda">
      <circle class="p" cx="90"   cy="360" r="1.6" style="animation-duration:11s"/>
      <circle class="p" cx="210"  cy="360" r="1.1" style="animation-duration:14s;animation-delay:3s"/>
      <circle class="p" cx="330"  cy="360" r="2"   style="animation-duration:9s;animation-delay:5s"/>
      <circle class="p" cx="470"  cy="360" r="1.2" style="animation-duration:13s;animation-delay:1s"/>
      <circle class="p" cx="560"  cy="360" r="1.5" style="animation-duration:16s;animation-delay:7s"/>
      <circle class="p" cx="690"  cy="360" r="1"   style="animation-duration:10s;animation-delay:2s"/>
      <circle class="p" cx="780"  cy="360" r="1.8" style="animation-duration:12s;animation-delay:6s"/>
      <circle class="p" cx="900"  cy="360" r="1.2" style="animation-duration:15s;animation-delay:4s"/>
      <circle class="p" cx="1010" cy="360" r="1.6" style="animation-duration:11s;animation-delay:8s"/>
      <circle class="p" cx="1120" cy="360" r="1"   style="animation-duration:13s;animation-delay:2.5s"/>
    </g>

    <text class="mono in a1" x="600" y="104" text-anchor="middle" font-size="18" fill="#64ffda" letter-spacing="2">hi, i'm</text>
    <text class="sans in a2" x="600" y="186" text-anchor="middle" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#nameFill)">sh4rron</text>

    <g class="in a3">
      <rect class="sweep" x="450" y="261" width="300" height="1.5" fill="url(#line)"/>
      <g class="mono" font-size="22" text-anchor="middle">
        <text class="role"    x="600" y="236" fill="#8892b0"><tspan fill="#64ffda">&gt; </tspan>still learning, always building</text>
        <text class="role r2" x="600" y="236" fill="#8892b0"><tspan fill="#64ffda">&gt; </tspan>on my way to IT project manager</text>
        <text class="role r3" x="600" y="236" fill="#8892b0"><tspan fill="#64ffda">&gt; </tspan>future software engineer</text>
      </g>
      <text class="mono" x="600" y="300" text-anchor="middle" font-size="13" fill="#4a6182">building small things with big attention to detail<tspan class="caret" fill="#64ffda"> _</tspan></text>
    </g>

    <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#64ffda" stroke-opacity=".15"/>
  </g>
</svg>
